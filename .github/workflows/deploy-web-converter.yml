name: Deploy Web Converter

on:
  push:
    branches:
      - main
    paths:
      - web-converter/**
      - .github/workflows/deploy-web-converter.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web-converter
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish web-converter to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web-converter
          force_orphan: true
